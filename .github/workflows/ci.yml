name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-cidr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (swift:6.3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: swift:6.3
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      - name: Resolve package graph
        run: swift package resolve

      - name: Build library targets
        run: |
          swift build --target CIDR
          swift build --target CIDRArgumentParser
          swift build --target CIDRPOSIX
          swift build --target CIDRNIO

      - name: Test
        run: ./scripts/test.sh

  linux-minimum:
    name: linux minimum toolchain (swift:6.2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: swift:6.2
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      - name: Resolve package graph
        run: swift package resolve

      - name: Build library targets
        run: |
          swift build --target CIDR
          swift build --target CIDRArgumentParser
          swift build --target CIDRPOSIX
          swift build --target CIDRNIO

      - name: Test
        run: ./scripts/test.sh

  macos:
    name: macOS 26 (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Require Xcode 26.6
        run: test "$(xcodebuild -version | head -n 1)" = "Xcode 26.6"

      - name: Resolve package graph
        run: swift package resolve

      - name: Build library targets at the macOS 15 deployment floor
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          swift build --target CIDR
          swift build --target CIDRArgumentParser
          swift build --target CIDRPOSIX
          swift build --target CIDRNIO

      - name: Test
        run: ./scripts/test.sh

      - name: Build library targets for the iOS 18 simulator deployment floor
        run: |
          sdk_path="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swift build \
            --scratch-path .build/ios18-simulator \
            --target CIDR \
            --triple arm64-apple-ios18.0-simulator \
            --sdk "${sdk_path}"
          swift build \
            --scratch-path .build/ios18-simulator \
            --target CIDRArgumentParser \
            --triple arm64-apple-ios18.0-simulator \
            --sdk "${sdk_path}"
          swift build \
            --scratch-path .build/ios18-simulator \
            --target CIDRPOSIX \
            --triple arm64-apple-ios18.0-simulator \
            --sdk "${sdk_path}"
          swift build \
            --scratch-path .build/ios18-simulator \
            --target CIDRNIO \
            --triple arm64-apple-ios18.0-simulator \
            --sdk "${sdk_path}"

  macos-15-compatibility:
    name: macOS 15 compatibility (Xcode 26.3)
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: Show host and toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Require macOS 15
        run: test "$(sw_vers -productVersion | cut -d. -f1)" = "15"

      - name: Require Xcode 26.3
        run: test "$(xcodebuild -version | head -n 1)" = "Xcode 26.3"

      - name: Resolve package graph
        run: swift package resolve

      - name: Build CIDRNIO at the macOS 15 deployment floor
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: swift build --target CIDRNIO

      - name: Test CIDRNIO compatibility path
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: ./scripts/test.sh --filter CIDRNIOTests

  linux-benchmark-build:
    name: linux benchmark build (swift:6.3)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: swift:6.3
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      - name: Build benchmark targets
        run: |
          swift build --package-path Benchmarks --product CIDRProfileTarget
          ./scripts/benchmarks.sh build
          CIDR_BENCHMARK_TARGET=CIDRCPUBenchmarkTarget ./scripts/benchmarks.sh build
          CIDR_BENCHMARK_TARGET=CIDRNIOBenchmarkTarget ./scripts/benchmarks.sh build
